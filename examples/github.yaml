github:
  app_id: 12345
  credentials:
    provider: vault
    private_key_ref:
      mount: secret
      path: github/review-app/private-key
      field: value
    webhook_secret_ref:
      mount: secret
      path: github/review-app/webhook-secret
      field: value
vault:
  address: http://127.0.0.1:8100
  auth: proxy
