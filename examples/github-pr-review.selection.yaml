version: 1
agent: github-reviewer
handler: github.pr-review
trigger:
  adapter: github.pull_request
  actions: [opened, synchronize, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
selection:
  repositories:
    include: [acme/api, acme/web]
    exclude: [acme/legacy]
  pull_requests:
    base_branches: [main, "release/*"]
    drafts: false
    labels:
      require_any: [agent-review]
      exclude_any: [skip-agent-review]
    authors:
      exclude: ["dependabot[bot]", "renovate[bot]"]
    changed_paths:
      include: ["src/**", "packages/**"]
      exclude: ["docs/**", "**/*.md"]
