apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3-runtime
  namespace: t3-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: t3-runtime
  namespace: t3-workspaces
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, create, patch, delete]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, create, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t3-runtime
  namespace: t3-workspaces
subjects:
  - kind: ServiceAccount
    name: t3-runtime
    namespace: t3-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: t3-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-runtime
  namespace: t3-control
spec:
  replicas: 1
  selector:
    matchLabels: {app: t3-runtime}
  template:
    metadata:
      labels: {app: t3-runtime}
    spec:
      serviceAccountName: t3-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runtime
          image: REPLACE_REGISTRY/t3-runtime@sha256:REPLACE_DIGEST
          ports:
            - {name: control, containerPort: 8084}
          env:
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef: {name: t3-runtime-secrets, key: hatchet-client-token}
            - name: T3_PROFILES_FILE
              value: /config/t3-profiles.json
            - name: AGENT_SECRET_KEY_FILE
              value: /secrets/runtime-key
            - name: T3_CONTROL_TOKEN_FILE
              value: /secrets/t3-control-token
          readinessProbe:
            httpGet: {path: /healthz, port: control}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: profiles, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
        - name: profiles
          configMap: {name: t3-profiles}
        - name: secrets
          secret:
            secretName: t3-runtime-secrets
            defaultMode: 0444
            items:
              - {key: runtime-key, path: runtime-key}
              - {key: t3-control-token, path: t3-control-token}
---
apiVersion: v1
kind: Service
metadata:
  name: t3-runtime
  namespace: t3-control
spec:
  selector: {app: t3-runtime}
  ports:
    - {name: control, port: 8084, targetPort: control}
