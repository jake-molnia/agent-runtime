name: Container images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.' >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: make build

  images:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [worker, sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Check the native container target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker buildx build --load --platform linux/amd64 --target "$TARGET" --tag "agent-runtime-check:$TARGET" .
          if [[ "$TARGET" == sandbox ]]; then
            docker run --rm --entrypoint /bin/sh "agent-runtime-check:$TARGET" -ec '
              test "$(id -u)" -eq 0
              touch /root/agent-runtime-root-check
              git --version
              python3 --version
              opencode --version
              agent-runtime version
            '
          else
            docker run --rm --entrypoint /bin/sh "agent-runtime-check:$TARGET" -ec '
              test "$(id -u)" -eq 1000
              agent-runtime version
            '
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  channel:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Every push builds its SHA tags. Only channel promotion is serialized.
    concurrency:
      group: image-channel-${{ github.ref == 'refs/heads/main' && 'nightly' || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == branch ]]; then
            current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$current" != "$REVISION" ]]; then
              echo 'A newer main commit exists; keeping the SHA images without moving nightly.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            source="sha-$REVISION"
            channel=nightly
          else
            source="$REF_NAME"
            channel=latest
          fi
          for target in worker sandbox; do
            image="ghcr.io/${REPOSITORY,,}-$target"
            docker buildx imagetools create --tag "$image:$channel" "$image:$source"
            echo "Promoted \`$image:$source\` to \`$image:$channel\`." >> "$GITHUB_STEP_SUMMARY"
          done
